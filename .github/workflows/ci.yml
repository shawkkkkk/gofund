name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Solana RPC compatibility smoke
        run: npm run smoke:web3
      - name: Bigint compatibility smoke
        run: npm run smoke:bigint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
